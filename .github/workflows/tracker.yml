name: paper-tracker

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours at :17 UTC (off the hour to avoid cron congestion)
  workflow_dispatch:

concurrency:
  group: paper-tracker      # never two runs writing data/ at the same time
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tracker (paper only, stdlib, no secrets)
        run: python tracker.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data REPORT.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "paper run $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
